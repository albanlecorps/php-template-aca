name: Build and Push

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  RG: rg-frc-pprodgeneral
  ACR_NAME: pprodnbtregistry
  ACR_LOGIN_SERVER: pprodnbtregistry-aucgecdkece6b5d7.azurecr.io
  IMAGE_NAME: php-template-aca

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login ACR
        run: az acr login --name $ACR_NAME

      - name: Build image
        run: |
          docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest .

      - name: Push image
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest